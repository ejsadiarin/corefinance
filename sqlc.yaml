---
version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "db"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_empty_slices: true
        emit_exact_table_names: false
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
              pointer: true
          # The rule views carry kind for inserts (#11); their JSON stays as before.
          - column: "recurring_expense_rules.kind"
            go_struct_tag: 'json:"-"'
          - column: "recurring_income_rules.kind"
            go_struct_tag: 'json:"-"'
          # Inserting transaction id (#13): pgx scans xid8 as uint64. Not part of
          # the entries' JSON; the review feed turns it into an opaque cursor.
          - db_type: "xid8"
            go_type: "uint64"
          - column: "expenses.txid"
            go_struct_tag: 'json:"-"'
          - column: "incomes.txid"
            go_struct_tag: 'json:"-"'
